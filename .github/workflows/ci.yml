name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: make install
      - run: make lint
      - run: make type
      - run: make security
      - run: make test-unit
      - run: make test

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t dbx2fabric-app:ci .
      - name: Smoke test /healthz
        run: |
          docker run -d --name app -e AUTH_DISABLED=true -p 9093:9093 dbx2fabric-app:ci
          for i in $(seq 1 30); do curl -fsS localhost:9093/healthz && exit 0; sleep 2; done
          docker logs app; exit 1
